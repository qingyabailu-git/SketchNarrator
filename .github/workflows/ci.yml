name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip .
      - name: Check resolved dependency compatibility
        run: python -m pip check
      - name: Compile public Python entry points
        run: python -m compileall -q scripts renderer/scripts
      - name: CLI smoke test
        run: python scripts/workflow.py --help
      - name: Windows launcher cold-start smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\run.cmd --help
      - name: Verify POSIX launcher executable bit
        if: runner.os != 'Windows'
        shell: bash
        run: test -x scripts/run.sh
      - name: POSIX launcher cold-start smoke
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/run.sh --help
      - name: Renderer tests
        run: python -m unittest discover -s renderer/tests -p "test*.py"
      - name: Workflow tests
        run: python -m unittest discover -s tests -p "test*.py"
      - name: Check release manifest
        run: python scripts/update_release_manifest.py --check
